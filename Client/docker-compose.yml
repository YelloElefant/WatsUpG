version: "3"
services:
  watsupg:
    image: yelloelefant/watsupg
    container_name: watsupg-client
    privileged: true
    environment:
      - serverPrivateIp=192.168.1.29
      - serverDomainName=watsupg.yelloelefant.com
      - token=123456789
    network_mode: host
    volumes:
      - ./clientData:/data
      - /sys:/sys:ro
      - /proc:/proc:ro
      - /dev:/dev:ro
    restart: unless-stopped
